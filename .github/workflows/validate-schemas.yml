name: Validate JSON Schemas

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install jsonschema
    
    - name: Validate JSON syntax
      run: |
        echo "Validating JSON files..."
        for file in schemas/*.json examples/*.json examples/identify-tool/*.json; do
          if [ -f "$file" ]; then
            python -m json.tool "$file" > /dev/null && echo "✓ $file valid" || (echo "✗ $file invalid" && exit 1)
          fi
        done
    
    - name: Validate examples against schemas
      run: |
        python -c "
        import json, jsonschema, glob

        # Validate identify tool response example against schema
        with open('schemas/identify-tool-response.json') as f:
            schema = json.load(f)
        for example_file in glob.glob('examples/identify-tool/*-response*.json'):
            with open(example_file) as f:
                example = json.load(f)
            try:
                jsonschema.validate(example, schema)
                print(f'✓ {example_file} validates against identify-tool-response schema')
            except jsonschema.ValidationError as e:
                print(f'✗ {example_file}: {e.message}')
                exit(1)
        print('All schema validations passed')
        "
